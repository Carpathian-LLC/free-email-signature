# Carpathian-specific deployment hook. It pings Carpathian's platform API to
# trigger a deploy and only does anything when the CARPATHIAN_API_KEY repo
# secret is set, so it is a harmless no-op on forks. If you fork this project,
# delete this file or replace it with your own deploy workflow.
name: Deploy to Carpathian

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Trigger Carpathian Deployment
        # Values are passed through env, never interpolated into the shell, so
        # commit messages with newlines, quotes, or shell metacharacters cannot
        # break the request or inject commands. jq builds correctly escaped JSON.
        env:
          CARPATHIAN_API_KEY: ${{ secrets.CARPATHIAN_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          WEBHOOK_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          if [ -z "$CARPATHIAN_API_KEY" ]; then
            echo "CARPATHIAN_API_KEY not set; skipping deploy trigger (e.g. a fork)."
            exit 0
          fi
          jq -n \
            --arg repository "$REPOSITORY" \
            --arg commit "$COMMIT" \
            --arg branch "$BRANCH" \
            --arg commit_message "$COMMIT_MESSAGE" \
            --arg author_name "$AUTHOR_NAME" \
            --arg author_email "$AUTHOR_EMAIL" \
            --arg webhook_url "$WEBHOOK_URL" \
            '{repository: $repository, commit: $commit, branch: $branch, commit_message: $commit_message, author_name: $author_name, author_email: $author_email, webhook_url: $webhook_url}' \
          | curl -X POST https://api.carpathian.ai/api/v1/deployment/trigger \
              -H "Authorization: Bearer $CARPATHIAN_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary @- \
              --fail-with-body
